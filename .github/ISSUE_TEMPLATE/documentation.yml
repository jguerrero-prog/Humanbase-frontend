name: Documentation
description: The README, AGENTS.md, DECISIONS.md or the design system site.
labels: [documentation]
body:
  - type: textarea
    id: goal
    attributes:
      label: What and why
      description: Which page or file, and what is missing or wrong.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we know it is finished.
    validations:
      required: true
